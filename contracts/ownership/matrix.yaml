# Account-level (`shared`) resources allowed by the environment-promotion spec ("Account-level shared
# resources"): pipeline tooling, the project budget and its action, the contract registry, immutable
# digest-addressed image repositories, and pre-existing third-party credential secrets referenced by name.
# Rows with scope `shared` above must be one of these kinds.
