shared_rows:
  pipeline-financialplanning: pipeline-tooling
  permission-boundaries: pipeline-tooling
  pipeline-financemodel: pipeline-tooling
  pipeline-financelambdastool: pipeline-tooling
  pipeline-financeagent: pipeline-tooling
  project-budget: project-budget
  contract-registry: contract-registry
  financemodel-ecr-repositories: image-repository
  financeagent-ecr-repository: image-repository
  jev-api-key-secret: third-party-credential-secret

# CDK-generated helper resources (task 1.5; spec cross-repo-ownership, "CDK-generated helper resources
# are attributed, never ignored"; design D1 note). CDK synthesizes resources that no construct in our
# code names directly. The ownership check never skips them. A helper without its own logical-role is:
#   - attributed to the owner of its parent construct when its type is in parent_attributed_types and
#     every template resource it references (Ref / Fn::GetAtt) is owned by the checked repository; or
#   - matched by an explicit, reviewed allow_list entry (type plus logical-id or aws:cdk:path pattern),
#     and attributed to the repository whose template is checked.
# Anything else fails OWN-01. Adding or widening an allow_list entry needs review: record the reason
# and the review (date and change or task) in the entry.
cdk_generated_helpers:
  parent_attributed_types:
    - AWS::IAM::Policy              # default policy CDK attaches to an owned role
    - AWS::Lambda::Permission       # invoke grant on an owned function
    - AWS::Lambda::EventInvokeConfig
    - AWS::Logs::LogGroup           # function log group created with a retention setting
    - Custom::LogRetention          # per-function log-retention custom resource
    - Custom::S3AutoDeleteObjects   # per-bucket auto-delete custom resource
    - AWS::ApiGateway::Method       # untaggable REST API method of an owned RestApi/Resource and integration
  allow_list:
    - id: cdk-metadata
      resource_types: [AWS::CDK::Metadata]
      logical_id_pattern: "CDKMetadata"
      reason: CDK version analytics resource; carries no project data and no permissions
      reviewed: 2026-10-07, establish-cross-repo-contracts task 1.5
    - id: cdk-log-retention-provider
      resource_types: [AWS::Lambda::Function, AWS::IAM::Role]
      logical_id_pattern: "LogRetention[0-9a-f]{32}(ServiceRole[0-9A-F]{8})?"
      reason: >-
        Stack-singleton provider function and role behind Custom::LogRetention; it only sets
        retention on the stack's own log groups
      reviewed: 2026-10-07, establish-cross-repo-contracts task 1.5
    - id: cdk-custom-resource-provider
      resource_types: [AWS::Lambda::Function, AWS::IAM::Role]
      logical_id_pattern: "Custom[A-Za-z0-9]+CustomResourceProvider(Handler|Role)[0-9A-F]{8}"
      reason: >-
        Stack-singleton CDK custom-resource provider (for example S3 auto-delete-objects); its
        custom-resource instances are attributed to their parent resources
      reviewed: 2026-10-07, establish-cross-repo-contracts task 1.5
